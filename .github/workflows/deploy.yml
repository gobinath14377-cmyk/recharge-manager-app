name: Deploy Recharge Manager

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Recharge Manager package
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name 'Recharge_Manager_Worker_*.zip' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)
          test -n "$ZIP"
          mkdir worker
          unzip -q "$ZIP" -d worker

      - name: Install dependencies
        working-directory: worker
        run: npm install

      - name: Apply D1 migration
        working-directory: worker
        run: npx wrangler d1 migrations apply recharge-manager-db --remote

      - name: Deploy to Cloudflare
        working-directory: worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
